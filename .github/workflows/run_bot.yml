name: Auto Send Telegram

on:
  schedule:
    # รันตอน 06:00 น. เวลาไทย เฉพาะจันทร์-ศุกร์ 
    # (ตรงกับ 23:00 UTC ของวันอาทิตย์-พฤหัสบดี)
    - cron: '0 23 * * 0-4'
    
    # รันตอน 18:00 น. เวลาไทย เฉพาะจันทร์-ศุกร์ 
    # (ตรงกับ 11:00 UTC ของวันจันทร์-ศุกร์)
    - cron: '0 11 * * 1-5'
    
  workflow_dispatch: # ปุ่มสำหรับกดรันเทสต์เอง

jobs:
  send-message:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
